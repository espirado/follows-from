name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with dev and demo extras
        run: python -m pip install -e ".[dev,demo]"
      - name: Run tests, including the end-to-end mock MCP server test
        run: python -m pytest -q -rs

  core-has-no-dependencies:
    name: core runs with no third-party packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install the checker alone into a bare virtualenv
        run: |
          python -m venv /tmp/bare
          /tmp/bare/bin/python -m pip install .
          /tmp/bare/bin/python -m pip list --format=freeze
      - name: Each example exits with its verdict's code
        run: |
          set +e
          for pair in supported:0 contradicted:1 insufficient:2; do
            name="${pair%%:*}"; want="${pair##*:}"
            /tmp/bare/bin/follows-from "examples/$name.json" > /dev/null
            got=$?
            echo "$name.json -> exit $got (want $want)"
            [ "$got" -eq "$want" ] || exit 1
          done
