[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "follows-from"
version = "0.1.0"
description = "Does an agent's action follow from the evidence it actually got? A ternary evidence-to-action consistency check for MCP traces."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["mcp", "goose", "agents", "audit", "evidence", "aaif"]

# The checker has zero runtime dependencies.
dependencies = []

[project.optional-dependencies]
# only needed to run the reproducible goose demo server in goose/
demo = ["fastmcp>=4,<5"]
dev = ["pytest>=8"]

[project.scripts]
follows-from = "follows_from.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["follows_from"]
